services:
  - type: web
    name: triage-ai-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: software/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: production
      # Supabase API Credentials
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Supabase PostgreSQL connection string (Session pooler port 5432 or Transaction pooler port 6543)
      # e.g.: postgresql://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESET_ADMIN_PASSWORD
        value: "false"
      - key: DEVICE_AUTH_TOKEN
        generateValue: true
      - key: DEVICE_HMAC_SECRET
        generateValue: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: "ap-south-1"
      - key: S3_BUCKET_NAME
        value: "triage-ai-photos"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
