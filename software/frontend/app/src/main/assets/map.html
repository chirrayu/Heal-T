<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; }
        body { height: 100%; background-color: #07111F; }
        #map { width: 100%; height: 100%; min-height: 400px; }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: rgba(7, 17, 31, 0.85);
            border: 1px solid #1a3a5c;
            border-radius: 8px;
            padding: 8px 14px;
            z-index: 1000;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
            font-size: 13px;
            font-family: sans-serif;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .live-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: 2px solid #00ff88;
            color: #00ff88;
            font-family: sans-serif;
            font-size: 13px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            z-index: 1000;
            letter-spacing: 1px;
        }

        .map-title {
            position: absolute;
            top: 12px;
            left: 14px;
            color: white;
            font-family: sans-serif;
            font-size: 15px;
            font-weight: bold;
            z-index: 1000;
            letter-spacing: 1px;
        }

        .dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 8px currentColor;
        }

        .dot-stable   { background: #00e676; color: #00e676; }
        .dot-serious  { background: #ffd600; color: #ffd600; }
        .dot-critical { background: #ff1744; color: #ff1744; }
        .dot-offline  { background: #757575; color: #757575; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="map-title">PATIENT LOCATION MAP</div>
<div class="live-badge">LIVE</div>

<div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#00e676;"></div> Stable</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ffd600;"></div> Serious</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ff1744;"></div> Critical</div>
    <div class="legend-item"><div class="legend-dot" style="background:#757575;"></div> Offline</div>
</div>

<script>

    // ⚠ CHANGED — previously hardcoded to New Delhi (28.6139, 77.2090).
    // Starts as a neutral wide-zoom world view instead; Kotlin calls
    // centerMap(lat, lng) as soon as the phone's real GPS location is
    // available, so this never shows a specific city by default.
    // Escape HTML to prevent XSS in map markers
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;')
                  .replace(/'/g, '&#39;');
    }

    var map = L.map('map', {
        center: [20, 0],
        zoom: 2,
        zoomControl: true
    });

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        { attribution: '© OpenStreetMap', maxZoom: 19 }
    ).addTo(map);


    function createDotIcon(status) {
        var colors = {
            stable:   '#00e676',
            serious:  '#ffd600',
            critical: '#ff1744',
            offline:  '#757575'
        };
        var color = colors[status] || '#ffffff';
        return L.divIcon({
            className: '',
            html:
                '<div style="' +
                    'width:18px;' +
                    'height:18px;' +
                    'border-radius:50%;' +
                    'background:' + color + ';' +
                    'border:2px solid rgba(255,255,255,0.3);' +
                    'box-shadow:0 0 10px ' + color + ';' +
                '"></div>',
            iconSize:   [18, 18],
            iconAnchor: [9, 9],
            popupAnchor:[0, -10]
        });
    }

    // ⚠ CHANGED — previously seeded with 8 hardcoded fake soldiers
    // (Alpha through Hotel) scattered around Delhi. Starts empty now —
    // real markers are created on demand by upsertMarker() below, called
    // from Kotlin whenever a real "location_update" arrives over the
    // WebSocket for an actual soldier_id.
    var markers = {};

    // ⚠ NEW — creates a marker the first time we hear about a soldier_id,
    // or updates it if we already have one. This replaces the old
    // approach of pre-seeding a fixed list of fake people.
    function upsertMarker(id, name, status, lat, lng) {
        if (markers[id]) {
            markers[id].setLatLng([lat, lng]);
            markers[id].setIcon(createDotIcon(status));
            markers[id].setPopupContent(
                '<b>' + escapeHtml(name) + '</b><br>Status: ' + status.toUpperCase() + '<br>ID: ' + id
            );
        } else {
            var marker = L.marker([lat, lng], { icon: createDotIcon(status) }).addTo(map);
            marker.bindPopup(
                '<b>' + escapeHtml(name) + '</b><br>Status: ' + status.toUpperCase() + '<br>ID: ' + id
            );
            markers[id] = marker;
        }
    }

    // Kept for backward compatibility — only affects markers that
    // already exist (i.e. created via upsertMarker first).
    function updatePosition(id, lat, lng) {
        if (markers[id]) {
            markers[id].setLatLng([lat, lng]);
        }
    }

    function updateStatus(id, status) {
        if (markers[id]) {
            markers[id].setIcon(createDotIcon(status));
        }
    }

    // ⚠ NEW — centers the map on a real coordinate (the phone's actual
    // GPS position). Called from Kotlin once a location fix is available,
    // replacing the old hardcoded New Delhi center.
    function centerMap(lat, lng, zoom) {
        map.setView([lat, lng], zoom || 15);
    }

    setTimeout(function() {
        map.invalidateSize();
    }, 500);

</script>

</body>
</html>
