version: '3.8'

services:
  triage-backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: triage_ai_backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
